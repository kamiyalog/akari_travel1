<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#070c0d">
    <title>収録音声確認ページ｜日本音声データ管理協会</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="../data.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="review-shell">
      <section class="password-area" id="password-area" aria-labelledby="password-title">
        <div class="gate-mark">JADA</div>
        <p class="eyebrow">VOICE RECORDING REVIEW / RESTRICTED</p>
        <h1 id="password-title">収録音声確認ページ</h1>
        <p class="gate-copy">お伝えした4桁の確認用パスワードを入力してください。</p>
        <form id="password-form">
          <label for="password-input">ACCESS CODE</label>
          <div class="password-controls">
            <input id="password-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required>
            <button type="submit">確認ページを開く</button>
          </div>
          <p class="password-message" id="password-message" role="alert" aria-live="polite"></p>
        </form>
      </section>

      <section class="locked-content" id="locked-content" hidden>
        <header class="review-header">
          <div class="review-brand">
            <span>JADA</span>
            <div>
              <b>収録音声確認ページ</b>
              <small>VOICE RECORDING REVIEW</small>
            </div>
          </div>
          <a href="../index.html">ゲーム本編を開く</a>
        </header>

        <div class="review-main">
          <section class="review-intro">
            <div>
              <p class="eyebrow">RECORDED FILE CHECK</p>
              <h1>担当音声を確認</h1>
              <p>役名を選ぶと、その役の収録対象だけを表示します。再生中に別の音声を再生すると、先に流れていた音声は自動で停止します。</p>
            </div>
            <div class="review-count" id="review-count"></div>
          </section>

          <nav class="role-navigation" id="role-navigation" aria-label="役名で絞り込む"></nav>
          <div class="voice-list" id="voice-list"></div>
        </div>

        <footer class="review-footer">
          <span>関係者確認用ページ</span>
          <button id="lock-button" type="button">確認ページを閉じる</button>
        </footer>
      </section>
    </main>
    <noscript>このページの表示にはJavaScriptを有効にする必要があります。</noscript>
  </body>
</html>
